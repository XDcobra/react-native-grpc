apply plugin: 'com.android.library'

// compileSdk / minSdk / targetSdk and the Android Gradle Plugin come from the host app
// (React Native 0.76+ defines them in the root build.gradle).
android {
  namespace 'com.reactnativegrpc'
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    minSdk rootProject.ext.minSdkVersion
    targetSdk rootProject.ext.targetSdkVersion
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // Version is resolved by the React Native Gradle plugin of the host app.
  implementation 'com.facebook.react:react-android'

  implementation 'io.grpc:grpc-okhttp:1.51.0'// CURRENT_GRPC_VERSION
  implementation 'io.grpc:grpc-stub:1.51.0' // CURRENT_GRPC_VERSION
}
